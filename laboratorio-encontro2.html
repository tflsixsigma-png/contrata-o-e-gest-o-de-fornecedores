<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laboratório de Diagnóstico · Encontro 2 — Gestão Estratégica de Compras e Suprimentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* =====================================================
   Laboratório de Diagnóstico · Encontro 2
   Sistema visual do curso: ivory / grafite / champanhe
   ===================================================== */
:root {
  --ivory: #F7F5EF;
  --card: #FFFFFF;
  --border: #D9D4C6;
  --hairline: #E6E1D5;
  --dark: #14171D;
  --dark-card: #1B212B;
  --dark-border: #2E3540;
  --ink: #1C1F26;
  --body: #4D525C;
  --muted: #8B909B;
  --gold: #9A7A2F;
  --gold-d: #C9A961;
  --ok: #3E6B4F;
  --ok-bg: #EDF3EE;
  --warn: #8A4B2E;
  --warn-bg: #F6EDE6;
  --serif: "Marcellus", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", "Courier New", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--gold); }

/* ---------- moldura ---------- */
.topbar {
  background: var(--dark);
  color: #E8E3D6;
  border-bottom: 2px solid var(--gold-d);
}
.topbar-inner {
  max-width: 1080px; margin: 0 auto; padding: 14px 24px;
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.topbar .brand { font-family: var(--mono); font-size: 11px; letter-spacing: .22em; color: var(--gold-d); text-transform: uppercase; }
.topbar .brand b { color: #fff; font-weight: 600; }
.topbar .session { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: #9AA0AB; }
.topbar .home-link { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--gold-d); text-decoration: none; cursor: pointer; background: none; border: 1px solid var(--dark-border); padding: 5px 12px; border-radius: 4px; }
.topbar .home-link:hover { border-color: var(--gold-d); }

.wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 72px; }

footer {
  background: var(--dark); color: #6E7480;
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
  text-align: center; padding: 22px 16px;
}
footer span { color: var(--gold-d); }

/* ---------- tipografia ---------- */
.eyebrow {
  font-family: var(--mono); font-size: 12px; font-weight: 600;
  letter-spacing: .26em; text-transform: uppercase; color: var(--gold);
  margin-bottom: 10px;
}
h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(30px, 4.5vw, 44px); line-height: 1.12; color: var(--ink); }
h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(24px, 3.2vw, 32px); line-height: 1.18; }
h3 { font-family: var(--serif); font-weight: 400; font-size: 20px; }
.lead { color: var(--body); font-size: 17px; max-width: 62ch; margin-top: 14px; }
.small { font-size: 13px; color: var(--muted); }
.gold { color: var(--gold); }

/* ---------- cards ---------- */
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 10px;
  padding: 26px 28px; margin-top: 22px;
}
.card.dark {
  background: var(--dark); border-color: var(--dark); color: #C9CDD6;
}
.card.dark h3, .card.dark h2 { color: #fff; }
.card.dark .eyebrow { color: var(--gold-d); }
.card.tinted { background: #EFEBE0; border-color: #E0DACA; }

/* ---------- home: mesas ---------- */
.mesa-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
.mesa {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 30px 28px 26px; cursor: pointer; position: relative;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  display: flex; flex-direction: column; gap: 12px; text-align: left; font-family: inherit;
}
.mesa:hover, .mesa:focus-visible { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(20,23,29,.10); border-color: var(--gold); outline: none; }
.mesa .num { font-family: var(--serif); font-size: 42px; color: var(--gold); line-height: 1; }
.mesa .metaetapa { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.mesa h3 { font-size: 22px; }
.mesa p { color: var(--body); font-size: 14.5px; flex: 1; }
.mesa .cta { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; color: var(--gold); text-transform: uppercase; }
.mesa .selo {
  position: absolute; top: 22px; right: 24px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .18em;
  color: var(--gold-d); background: var(--dark); border-radius: 999px; padding: 5px 12px;
}

/* ---------- wizard ---------- */
.trilha {
  display: flex; gap: 6px; margin: 26px 0 8px; flex-wrap: wrap;
}
.trilha .passo {
  flex: 1 1 120px; min-width: 110px;
  background: var(--card); border: 1px solid var(--border);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%, 8px 50%);
  padding: 9px 16px 9px 20px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.trilha .passo.done { background: #EFEBE0; color: var(--gold); border-color: #E0DACA; }
.trilha .passo.now { background: var(--dark); color: var(--gold-d); border-color: var(--dark); }

.step-head { margin-top: 26px; }
.step-head .missao {
  border-left: 3px solid var(--gold); background: #EFEBE0;
  padding: 14px 20px; border-radius: 0 8px 8px 0; margin-top: 16px;
  color: var(--ink); font-size: 15.5px;
}
.step-head .missao b { color: var(--gold); font-family: var(--mono); font-size: 11px; letter-spacing: .2em; display: block; margin-bottom: 4px; }

/* ---------- tabelas ---------- */
table.data { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14.5px; }
table.data th {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--gold); text-align: left; padding: 10px 12px; border-bottom: 2px solid var(--border);
}
table.data td { padding: 10px 12px; border-bottom: 1px solid var(--hairline); color: var(--ink); vertical-align: middle; }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.data tr.total td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: none; }
table.data td .sub { display: block; font-size: 12px; color: var(--muted); }

/* ---------- inputs ---------- */
select, input[type="number"], input[type="text"], textarea {
  font-family: var(--sans); font-size: 14.5px; color: var(--ink);
  background: #FDFCF9; border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 10px; width: 100%;
}
select:focus, input:focus, textarea:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: var(--gold); }
select.abc { width: 84px; text-align: center; font-weight: 700; }
input.mini { width: 110px; text-align: right; }
textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
.campo { margin-top: 16px; }
.campo label { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }

/* estados de validação */
.hit { background: var(--ok-bg) !important; border-color: var(--ok) !important; }
.miss { background: var(--warn-bg) !important; border-color: var(--warn) !important; }

/* ---------- botões ---------- */
.btn {
  display: inline-block; cursor: pointer; border-radius: 6px;
  font-family: var(--mono); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase;
  padding: 12px 26px; border: 1px solid var(--dark); background: var(--dark); color: var(--gold-d);
  transition: transform .12s ease, opacity .12s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--border); }
.btn.ghost:hover { border-color: var(--gold); color: var(--gold); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #fff; }
.btn-row { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; align-items: center; }
.btn-row .spacer { flex: 1; }

/* ---------- feedback ---------- */
.feedback { margin-top: 18px; border-radius: 8px; padding: 16px 20px; font-size: 14.5px; display: none; }
.feedback.show { display: block; }
.feedback.ok { background: var(--ok-bg); border: 1px solid #C6D8CB; color: #2E5140; }
.feedback.warn { background: var(--warn-bg); border: 1px solid #E4CDBB; color: #6E3D26; }
.feedback > b { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 6px; }
.feedback ul { margin: 8px 0 0 18px; }
.feedback li { margin-top: 4px; }

/* ---------- classificação em pills ---------- */
.pill-group { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
  border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px;
  cursor: pointer; background: #FDFCF9; color: var(--body); transition: all .12s ease;
}
.pill.on { background: var(--dark); color: var(--gold-d); border-color: var(--dark); }
.item-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px 4px; border-bottom: 1px solid var(--hairline); flex-wrap: wrap;
}
.item-row .item-label { font-size: 14.5px; flex: 1 1 260px; }
.item-row .item-label .sub { display: block; font-size: 12px; color: var(--muted); }

/* ---------- barras (gráficos CSS) ---------- */
.chart { margin-top: 20px; }
.bar-line { display: grid; grid-template-columns: 150px 1fr 74px; gap: 12px; align-items: center; margin-top: 10px; }
.bar-line .b-label { font-size: 13.5px; color: var(--ink); }
.bar-line .b-track { background: var(--hairline); border-radius: 4px; height: 22px; overflow: hidden; }
.bar-line .b-fill { height: 100%; background: #BCB49B; border-radius: 4px; transition: width .5s ease; }
.bar-line.hot .b-fill { background: var(--dark); }
.bar-line .b-val { font-variant-numeric: tabular-nums; font-size: 13.5px; text-align: right; color: var(--body); }

/* barras empilhadas TCO */
.stack-wrap { display: flex; gap: 40px; align-items: flex-end; justify-content: center; margin: 26px 0 6px; }
.stack { width: 150px; display: flex; flex-direction: column-reverse; border-radius: 6px 6px 0 0; overflow: hidden; }
.seg { width: 100%; display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: #fff; font-variant-numeric: tabular-nums; transition: height .4s ease; min-height: 0; }
.seg.aq { background: var(--gold); }
.seg.ut { background: #6E6046; }
.seg.fv { background: #4A5568; }
.seg.rs { background: var(--dark); }
.stack-label { text-align: center; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; margin-top: 8px; color: var(--ink); text-transform: uppercase; }
.stack-total { text-align: center; font-family: var(--serif); font-size: 22px; color: var(--ink); }
.legend { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 14px; font-size: 12.5px; color: var(--body); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* slider */
.slider-row { display: flex; align-items: center; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
.slider-row input[type="range"] { flex: 1 1 200px; accent-color: var(--gold); }
.slider-row .sl-val { font-family: var(--mono); font-size: 13px; color: var(--gold); min-width: 68px; text-align: right; }

/* forças */
.forca { margin-top: 22px; padding-bottom: 18px; border-bottom: 1px solid var(--hairline); }
.forca h4 { font-family: var(--serif); font-weight: 400; font-size: 17px; }
.forca .dica { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.forca .escala { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 2px; }

/* HHI display */
.hhi-out {
  font-family: var(--serif); font-size: 46px; color: var(--ink); text-align: center; margin-top: 18px;
}
.hhi-out small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .2em; color: var(--gold); text-transform: uppercase; }
.hhi-scale { display: flex; margin-top: 18px; border-radius: 6px; overflow: hidden; font-family: var(--mono); font-size: 10.5px; text-align: center; color: #fff; }
.hhi-scale div { padding: 8px 4px; }
.hhi-scale .s1 { flex: 1500; background: #BCB49B; }
.hhi-scale .s2 { flex: 1000; background: var(--gold); }
.hhi-scale .s3 { flex: 1500; background: var(--dark); color: var(--gold-d); }
.hhi-marker { font-family: var(--mono); font-size: 11px; color: var(--gold); margin-top: 6px; }

/* ---------- relatório ---------- */
.report { margin-top: 26px; }
.report .rep-block { border-left: 3px solid var(--gold); padding: 4px 0 4px 20px; margin-top: 24px; }
.report .rep-block h4 { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.report .rep-block p, .report .rep-block li { font-size: 15px; color: var(--ink); }
.report .rep-block ul { margin: 6px 0 0 18px; }
.report .vazio { color: var(--muted); font-style: italic; }

/* ---------- impressão ---------- */
@media print {
  body { background: #fff; }
  .topbar, footer, .trilha, .btn-row, .no-print { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .card { border: none; padding: 0; }
  .report .rep-block { break-inside: avoid; }
}

@media (max-width: 640px) {
  .bar-line { grid-template-columns: 110px 1fr 64px; }
  .stack-wrap { gap: 20px; }
  .stack { width: 110px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

</style>
</head>

function go(html) {
  app().innerHTML = html;
  window.scrollTo({ top: 0, behavior: "instant" });
}
function trilha(passos, atual) {
  return '<div class="trilha">' + passos.map((p, i) =>
    `<div class="passo ${i < atual ? "done" : i === atual ? "now" : ""}">${i + 1} · ${p}</div>`).join("") + "</div>";
}
function botoes(voltar, avancar, extra) {
  return `<div class="btn-row no-print">
    ${voltar ? `<button class="btn ghost" onclick="${voltar}">← Voltar</button>` : ""}
    <div class="spacer"></div>${extra || ""}
    ${avancar ? `<button class="btn" onclick="${avancar}">Avançar →</button>` : ""}
  </div>`;
}
function feedback(id) { return `<div class="feedback" id="${id}"></div>`; }
function showFb(id, ok, titulo, corpo) {
  const el = $("#" + id);
  el.className = "feedback show " + (ok ? "ok" : "warn");
  el.innerHTML = `<b>${titulo}</b>${corpo}`;
}

   ===================================================================== */
const G1_PASSOS = ["Briefing", "Curva ABC", "Benchmark", "Hipóteses", "Roteiro", "Relatório"];

function g1_start() {
  S.mesa = 1;
  go(`
    <div class="eyebrow">Mesa 1 · Análise Interna</div>
    <h1>Briefing — Aurora Alimentos</h1>
    ${trilha(G1_PASSOS, 0)}
    <div class="card">
      <h3>O contexto</h3>
      <p style="margin-top:10px;color:var(--body)">A Aurora gasta <b>R$ 48 milhões por ano</b> em embalagens
      flexíveis, distribuídos por <b>15 fornecedores</b> e <b>5 plantas</b> (Recife, Salvador, Curitiba,
      Joinville e Uberlândia). A base de dados acaba de passar por saneamento — os números são confiáveis.
      Nunca houve uma análise estruturada da categoria: cada planta compra por conta própria.</p>
      <div class="step-head"><div class="missao"><b>Sua missão</b>
      Produzir o diagnóstico interno da categoria: onde o gasto se concentra, quais plantas destoam,
      que hipóteses explicam as diferenças e que perguntas guiarão a investigação. Este é o insumo
      que a Etapa 3 (estratégia) vai receber.</div></div>
    </div>
    ${botoes("home()", "g1_abc()")}
  `);
}

function g1_abc() {
  const total = G1_FORN.reduce((s, f) => s + f.v, 0);
  let cum = 0;
  const rows = G1_FORN.map((f, i) => {
    const pct = f.v / total * 100; cum += pct;
    return `<tr>
      <td>${f.n}</td>
      <td class="num">${fmt(f.v)}</td>
      <td class="num">${pct.toFixed(1).replace(".", ",")}%</td>
      <td class="num">${cum.toFixed(1).replace(".", ",")}%</td>
      <td class="num"><select class="abc" id="abc${i}">
        <option value="">—</option>
        ${["A","B","C"].map(l => `<option ${S.g1.abc[i] === l ? "selected" : ""}>${l}</option>`).join("")}
      </select></td>
    </tr>`;
  }).join("");
  go(`
    <div class="eyebrow">Mesa 1 · Passo 2</div>
    <h2>Curva ABC dos fornecedores</h2>
    ${trilha(G1_PASSOS, 1)}
    <div class="card">
      <p style="color:var(--body)">Classifique cada fornecedor pela regra clássica:
      <b>A</b> até ~80% do gasto acumulado, <b>B</b> de 80% a 95%, <b>C</b> acima de 95%.</p>
      <table class="data">
        <thead><tr><th>Fornecedor</th><th class="num">Gasto (R$ mil/ano)</th><th class="num">% do total</th><th class="num">% acumulado</th><th class="num">Curva</th></tr></thead>
        <tbody>${rows}
        <tr class="total"><td>Total</td><td class="num">${fmt(total)}</td><td class="num">100%</td><td></td><td></td></tr></tbody>
      </table>
      ${feedback("fb-abc")}
      <div class="btn-row no-print"><button class="btn gold" onclick="g1_abcCheck()">Verificar classificação</button></div>
    </div>
    ${botoes("g1_start()", "g1_bench()")}
  `);
}
function g1_abcCheck() {
  let certos = 0, faltam = 0;
  G1_FORN.forEach((f, i) => {
    const sel = $("#abc" + i); const v = sel.value; S.g1.abc[i] = v;
    if (!v) { faltam++; sel.classList.remove("hit", "miss"); return; }
    if (v === G1_ABC_GAB[i]) { certos++; sel.classList.add("hit"); sel.classList.remove("miss"); }
    else { sel.classList.add("miss"); sel.classList.remove("hit"); }
  });
  if (faltam) { showFb("fb-abc", false, "Classificação incompleta", `<p>Faltam ${faltam} fornecedor(es) por classificar.</p>`); return; }
  if (certos === 10) {
    showFb("fb-abc", true, "Curva correta", `<p><b>4 fornecedores concentram 80% do gasto</b> — FlexPack, Polifilm,
    Embalatec e NovaFlex. Leitura executiva: o esforço de negociação e gestão de desempenho pertence a esses quatro;
    os 6 fornecedores de cauda (curva C) somam apenas 5% do gasto e são candidatos naturais a consolidação.</p>`);
  } else {
    showFb("fb-abc", false, `${certos} de 10 corretos`, `<p>Revise as células destacadas. Lembre: a curva é definida pelo
    <b>% acumulado</b>, não pelo % individual — o corte A/B acontece exatamente onde o acumulado atinge 80%.</p>`);
  }
}

function g1_bench() {
  const media = 48000 / G1_PLANTAS.reduce((s, p) => s + p.ton, 0);
  const rows = G1_PLANTAS.map((p, i) => `
    <tr><td>${p.n}</td>
      <td class="num">${fmt(p.gasto)}</td>
      <td class="num">${p.ton} mil t</td>
      <td class="num"><input type="number" class="mini" id="rt${i}" step="1" placeholder="R$/t"
        value="${S.g1.rton[i] || ""}"></td></tr>`).join("");
  go(`
    <div class="eyebrow">Mesa 1 · Passo 3</div>
    <h2>Benchmark interno: normalizar para comparar</h2>
    ${trilha(G1_PASSOS, 2)}
    <div class="card">
      <p style="color:var(--body)">Valor total não é comparável entre plantas de portes diferentes. Calcule o
      <b>gasto por tonelada produzida</b> (driver de consumo) de cada planta: gasto ÷ produção.</p>
      <table class="data">
        <thead><tr><th>Planta</th><th class="num">Gasto embalagem (R$ mil)</th><th class="num">Produção</th><th class="num">R$ / tonelada</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="chart" id="benchChart"></div>
      ${feedback("fb-bench")}
      <div class="btn-row no-print"><button class="btn gold" onclick="g1_benchCheck()">Calcular e comparar</button></div>
      <p class="small">Referência da média da rede: R$ ${media.toFixed(0)}/t (R$ 48.000 mil ÷ 365 mil t).</p>
    </div>
    ${botoes("g1_abc()", "g1_hip()")}
  `);
}
function g1_benchCheck() {
  const gab = G1_PLANTAS.map(p => p.gasto / p.ton);
  let ok = true, chart = "";
  G1_PLANTAS.forEach((p, i) => {
    const inp = $("#rt" + i); const v = parseFloat(inp.value);
    S.g1.rton[i] = inp.value;
    const certo = !isNaN(v) && Math.abs(v - gab[i]) <= 1;
    inp.classList.toggle("hit", certo); inp.classList.toggle("miss", !certo);
    if (!certo) ok = false;
  });
  if (!ok) { showFb("fb-bench", false, "Verifique os cálculos destacados", "<p>R$/t = gasto (R$ mil) ÷ produção (mil t). Ex.: Curitiba = 12.100 ÷ 100 = 121.</p>"); $("#benchChart").innerHTML = ""; return; }
  const max = Math.max(...gab);
  const ordenado = G1_PLANTAS.map((p, i) => ({ n: p.n, v: gab[i] })).sort((a, b) => b.v - a.v);
  $("#benchChart").innerHTML = ordenado.map(p => `
    <div class="bar-line ${p.v >= 140 ? "hot" : ""}">
      <div class="b-label">${p.n}</div>
      <div class="b-track"><div class="b-fill" style="width:${(p.v / max * 100).toFixed(0)}%"></div></div>
      <div class="b-val">R$ ${p.v.toFixed(0)}/t</div>
    </div>`).join("");
  showFb("fb-bench", true, "Disparidade revelada", `<p>Salvador (R$ 152/t) e Recife (R$ 148/t) gastam <b>~28% mais por
  tonelada</b> que Joinville (R$ 118/t). Se as duas convergissem para a média da rede (R$ 132/t), o potencial seria de
  aproximadamente <b>R$ 2,0 milhões/ano</b> — (148−132)×65 + (152−132)×50. O comparativo não prova o ganho:
  ele diz <b>onde investigar</b>. É o próximo passo.</p>`);
}

function g1_hip() {
  go(`

    ${trilha(G1_PASSOS, 3)}

      <div style="margin-top:6px">
      ${G1_HIP.map((h, i) => `

      ${feedback("fb-hip")}
    </div>
    ${botoes("g1_bench()", "g1_perg()")}
  `);
}
function g1_togHip(i, btn) {
  const idx = S.g1.hipoteses.indexOf(i);
  if (idx >= 0) { S.g1.hipoteses.splice(idx, 1); btn.classList.remove("on"); btn.textContent = "Selecionar"; }
  else if (S.g1.hipoteses.length < 3) { S.g1.hipoteses.push(i); btn.classList.add("on"); btn.textContent = "Selecionada"; }
  else { showFb("fb-hip", false, "Limite de três", "<p>Escolher é priorizar: mantenha no máximo três hipóteses. Desmarque uma para trocar.</p>"); }
}

function g1_perg() {
  go(`
    <div class="eyebrow">Mesa 1 · Passo 5</div>
    <h2>O roteiro de perguntas da categoria</h2>
    ${trilha(G1_PASSOS, 4)}
    <div class="card">
      <p style="color:var(--body)">A spend analysis vira processo quando existe um roteiro escrito. Do banco
      abaixo, selecione as <b>cinco perguntas</b> que o grupo levaria para a investigação desta categoria.</p>
      <div style="margin-top:6px">
      ${G1_PERG.map((p, i) => `
        <div class="item-row"><div class="item-label">${p.t}</div>
        <div class="pill-group"><button class="pill ${S.g1.perguntas.includes(i) ? "on" : ""}"
          onclick="g1_togPerg(${i}, this)">${S.g1.perguntas.includes(i) ? "No roteiro" : "Incluir"}</button></div></div>`).join("")}
      </div>
      ${feedback("fb-perg")}
      <div class="btn-row no-print"><button class="btn gold" onclick="g1_pergCheck()">Verificar roteiro</button></div>
    </div>
    ${botoes("g1_hip()", "g1_report()")}
  `);
}
function g1_togPerg(i, btn) {
  const idx = S.g1.perguntas.indexOf(i);
  if (idx >= 0) { S.g1.perguntas.splice(idx, 1); btn.classList.remove("on"); btn.textContent = "Incluir"; }
  else if (S.g1.perguntas.length < 5) { S.g1.perguntas.push(i); btn.classList.add("on"); btn.textContent = "No roteiro"; }
  else { showFb("fb-perg", false, "Roteiro cheio", "<p>Cinco perguntas — priorizar também é análise. Desmarque uma para trocar.</p>"); }
}
function g1_pergCheck() {
  if (S.g1.perguntas.length < 5) { showFb("fb-perg", false, "Roteiro incompleto", `<p>Selecione ${5 - S.g1.perguntas.length} pergunta(s) a mais.</p>`); return; }
  const cores = G1_PERG.map((p, i) => p.core ? i : -1).filter(i => i >= 0);
  const pegou = cores.filter(i => S.g1.perguntas.includes(i));
  if (pegou.length === 3) {
    showFb("fb-perg", true, "Roteiro forte", `<p>As três perguntas críticas para <b>esta</b> categoria estão dentro:
    preço distinto pelo mesmo item (dado que 5 plantas compram sozinhas), cobertura contratual e “opção técnica”.
    As outras duas escolhas são legítimas — justifiquem na plenária por que entraram.</p>`);
  } else {
    const faltando = cores.filter(i => !S.g1.perguntas.includes(i)).map(i => `<li>${G1_PERG[i].t}</li>`).join("");
    showFb("fb-perg", false, "Reveja as prioridades", `<p>Para uma categoria comprada por 5 plantas de forma
    descentralizada, ficaram de fora perguntas críticas:</p><ul>${faltando}</ul>
    <p style="margin-top:8px">Nenhuma pergunta do banco é “errada” — mas o roteiro tem espaço limitado, e o contexto define a prioridade.</p>`);
  }
}

function g1_report() {

  const perg = S.g1.perguntas.map(i => `<li>${G1_PERG[i].t}</li>`).join("") || '<li class="vazio">Roteiro não montado</li>';
  const livre = S.g1.hipLivre || ($("#hipLivre") ? $("#hipLivre").value : "");
  go(`
    <div class="eyebrow">Mesa 1 · Relatório para a plenária</div>
    <h2>Diagnóstico Interno — Embalagens Flexíveis</h2>
    ${trilha(G1_PASSOS, 5)}

    </div>
    <div class="btn-row no-print">
      <button class="btn ghost" onclick="g1_perg()">← Voltar</button>
      <div class="spacer"></div>
      <button class="btn ghost" onclick="window.print()">Imprimir / PDF</button>
      <button class="btn" onclick="home()">Concluir mesa ✓</button>
    </div>
  `);

function g3_totais() {
  const pa = S.g3.probA / 100, pb = S.g3.probB / 100;
  const dA = Math.round(G3_DISRUP.custoA * pa), dB = Math.round(G3_DISRUP.custoB * pb);
  const dims = { aq: [0, 0], ut: [0, 0], fv: [0, 0], rs: [dA, dB] };
  G3_ITENS.filter(it => it.dim !== "trap").forEach(it => {
    dims[it.dim][0] += it.a; dims[it.dim][1] += it.b;
  });
  const tA = dims.aq[0] + dims.ut[0] + dims.fv[0] + dims.rs[0];
  const tB = dims.aq[1] + dims.ut[1] + dims.fv[1] + dims.rs[1];
  return { dims, tA, tB, dA, dB };
}

    let corpo = "";
    if (errIn.length) corpo += `<p><b>Entraram, mas não deviam:</b></p><ul>${errIn.map(t => `<li>${t} — não é custo incremental desta decisão.</li>`).join("")}</ul>`;
    if (errOut.length) corpo += `<p style="margin-top:6px"><b>Ficaram de fora, mas compõem o TCO:</b></p><ul>${errOut.map(t => `<li>${t}</li>`).join("")}</ul>`;
    showFb("fb-montar", false, "A conta ainda não fecha", corpo);
    $("#g3parcial").innerHTML = "";
    return;
  }
  const { tA, tB, dA, dB } = g3_totais();
  showFb("fb-montar", true, "TCO consolidado", `<p>Com o custo esperado de disrupção nas premissas-base
  (A: ${fmtR(dA)} mil · B: ${fmtR(dB)} mil), os totais de 5 anos ficam:
  <b>A = ${fmtR(tA)} mil</b> · <b>B = ${fmtR(tB)} mil</b>. A diferença de preço era de R$ 700 mil;
  a diferença de custo total é de ${fmtR(Math.abs(tA - tB))} mil. Siga para o teste de sensibilidade.</p>`);
  $("#g3parcial").innerHTML = "";
}

function g3_sens() {
  go(`
    <div class="eyebrow">Mesa 3 · Passo 4</div>
    <h2>Sensibilidade: a premissa que decide</h2>
    ${trilha(G3_PASSOS, 3)}
    <div class="card">
      <p style="color:var(--body)">O custo esperado de disrupção é <b>probabilidade × impacto</b>. O impacto de uma
      parada longa é maior no importado (peças a 60–90 dias): A = R$ ${fmt(G3_DISRUP.custoA)} mil · B = R$ ${fmt(G3_DISRUP.custoB)} mil.
      As probabilidades no horizonte de 5 anos são <i>premissas</i> — mova-as e veja a decisão reagir.</p>
      <div class="slider-row"><span style="min-width:230px">Prob. de parada longa — Fornecedor A</span>
        <input type="range" min="0" max="40" value="${S.g3.probA}" id="slA" oninput="g3_sensUpd()">
        <span class="sl-val" id="vA">${S.g3.probA}%</span></div>
      <div class="slider-row"><span style="min-width:230px">Prob. de parada longa — Fornecedor B</span>
        <input type="range" min="0" max="40" value="${S.g3.probB}" id="slB" oninput="g3_sensUpd()">
        <span class="sl-val" id="vB">${S.g3.probB}%</span></div>
      <div class="stack-wrap" id="stacks"></div>
      <div class="legend">
        <span><i style="background:var(--gold)"></i>Aquisição</span>
        <span><i style="background:#6E6046"></i>Utilização</span>
        <span><i style="background:#4A5568"></i>Fim de vida (líquido)</span>
        <span><i style="background:var(--dark)"></i>Risco</span>
      </div>
      <div class="feedback show ok" id="sensMsg" style="margin-top:20px"></div>
      <p class="small">Premissas de referência do case: A 15% (histórico do suporte nacional na região) · B 5%
      (disponibilidade demonstrada em plantas semelhantes). O grupo pode defender premissas diferentes — desde que diga de onde vêm.</p>
    </div>
    ${botoes("g3_montar()", "g3_decisao()")}
  `);
}
function g3_sensUpd() {
  S.g3.probA = +$("#slA").value; S.g3.probB = +$("#slB").value;
  $("#vA").textContent = S.g3.probA + "%"; $("#vB").textContent = S.g3.probB + "%";
  g3_drawStacks();
}
function g3_drawStacks() {
  const { dims, tA, tB } = g3_totais();
  const scale = 0.075; /* px por R$ mil */
  const fv = i => Math.max(dims.fv[i], 0) === dims.fv[i] ? dims.fv[i] : dims.fv[i]; /* pode ser negativo */
  const seg = (cls, v) => v > 0 ? `<div class="seg ${cls}" style="height:${Math.max(v * scale, v > 40 ? 18 : 6)}px">${v >= 150 ? fmt(v) : ""}</div>` : "";
  const col = (i, label, tot) => `
    <div>
      <div class="stack-total">${fmt(tot)}</div>
      <div class="stack">
        ${seg("aq", dims.aq[i])}${seg("ut", dims.ut[i])}${seg("fv", Math.max(dims.fv[i], 0) || 0)}${seg("rs", dims.rs[i])}
      </div>
      <div class="stack-label">${label}</div>
      <div class="small" style="text-align:center">fim de vida líquido: ${dims.fv[i] < 0 ? "−" + fmt(-dims.fv[i]) : fmt(dims.fv[i])}</div>
    </div>`;
  $("#stacks").innerHTML = col(0, "Fornecedor A", tA) + col(1, "Fornecedor B", tB);
  const diff = tA - tB;
  const msg = diff > 60 ? `<b>Nas premissas atuais</b><p>B fica ${fmtR(diff)} mil mais barato no total — o prêmio de 29% no preço se paga em operação e risco.</p>`
    : diff < -60 ? `<b>Nas premissas atuais</b><p>A fica ${fmtR(-diff)} mil mais barata no total — o desempenho superior de B não compensa o prêmio de preço.</p>`
    : `<b>Nas premissas atuais</b><p>Empate técnico (diferença de ${fmtR(Math.abs(diff))} mil em ${fmtR(tA)} mil). A decisão passa a depender de fatores além do TCO — e é exatamente isso que o grupo deve dizer ao CFO.</p>`;
  $("#sensMsg").innerHTML = msg + `<p class="small" style="margin-top:6px">Preço ÷ TCO: A ${(2400 / tA * 100).toFixed(0)}% · B ${(3100 / tB * 100).toFixed(0)}% — a cotação enxerga só essa fração do custo real.</p>`;
}

function g3_decisao() {
  go(`
    <div class="eyebrow">Mesa 3 · Passo 5</div>
    <h2>A recomendação ao CFO</h2>
    ${trilha(G3_PASSOS, 4)}
    <div class="card">
      <p style="color:var(--body)">Com o TCO montado e a sensibilidade testada, formulem a recomendação.
      Não existe resposta única — existe recomendação <b>bem defendida</b>.</p>
      <div class="campo"><label>Decisão do grupo</label>
        <div class="pill-group" id="decPills">
          ${[["A","Adjudicar ao Fornecedor A"],["B","Adjudicar ao Fornecedor B"],["COND","Decisão condicionada (especificar)"]].map(([v, l]) =>
            `<button class="pill ${S.g3.decisao === v ? "on" : ""}" onclick="g3_setDec('${v}', this)">${l}</button>`).join("")}
        </div></div>
      <div class="campo"><label>O argumento, na linguagem do CFO (3–5 linhas)</label>
        <textarea id="g3arg" style="min-height:120px" placeholder="Ex.: a proposta B custa R$ 700 mil a mais na assinatura, mas... / recomendamos A condicionado a um contrato de disponibilidade porque...">${S.g3.argumento}</textarea></div>
      <div class="card tinted" style="margin-top:20px;padding:18px 22px">
        <p class="small" style="color:var(--ink)"><b>Checklist do argumento forte:</b> apresenta os dois TCOs lado a lado ·
        explicita a premissa de risco e sua fonte · converte a diferença em R$/ano · antecipa a objeção do diretor
        industrial (“29% mais caro”) · diz o que faria a decisão mudar.</p>
      </div>
    </div>
    ${botoes("g3_sens()", "g3_report()")}
  `);
}
function g3_setDec(v, btn) {
  S.g3.decisao = v;
  $$("#decPills .pill").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
}

function g3_report() {
  S.g3.argumento = $("#g3arg") ? $("#g3arg").value : S.g3.argumento;
  const { tA, tB, dA, dB } = g3_totais();
  const dec = { A: "Adjudicar ao Fornecedor A", B: "Adjudicar ao Fornecedor B", COND: "Decisão condicionada" }[S.g3.decisao] || null;
  go(`
    <div class="eyebrow">Mesa 3 · Relatório para a plenária</div>
    <h2>TCO Comparativo — Nova Envasadora</h2>
    ${trilha(G3_PASSOS, 5)}
    <div class="card report">
      <div class="rep-block"><h4>1 · A pergunta certa</h4>
        <p>A proposta B chega <b>29% mais cara no preço</b> (R$ 3.100 × R$ 2.400 mil). A análise responde outra
        pergunta: qual custa menos <i>em 5 anos</i>?</p></div>
      <div class="rep-block"><h4>2 · TCO consolidado (premissas do grupo)</h4>
        <p>Fornecedor A: <b>${fmtR(tA)} mil</b> · Fornecedor B: <b>${fmtR(tB)} mil</b> —
        diferença de ${fmtR(Math.abs(tA - tB))} mil.
        Custo esperado de disrupção: A ${fmtR(dA)} mil (prob. ${S.g3.probA}%) · B ${fmtR(dB)} mil (prob. ${S.g3.probB}%).</p>
        <p class="small">Preço ÷ TCO: A ${(2400 / tA * 100).toFixed(0)}% · B ${(3100 / tB * 100).toFixed(0)}% — a cotação enxerga só essa fração do custo real.</p></div>
      <div class="rep-block"><h4>3 · O que ficou fora — e por quê</h4>
        <p>Depreciação da envasadora antiga (custo afundado) e rateio de overhead (não incremental).
        TCO compara apenas o que a decisão altera.</p></div>
      <div class="rep-block"><h4>4 · Recomendação</h4>
        <p>${dec ? "<b>" + dec + "</b>" : '<span class="vazio">Decisão não registrada — voltem ao passo 5.</span>'}</p>
        <p style="margin-top:6px">${S.g3.argumento || '<span class="vazio">Argumento não preenchido.</span>'}</p></div>
      <div class="rep-block"><h4>5 · Mensagem final</h4>
        <p>O menor preço raramente é o menor custo — e quando os TCOs empatam, a análise cumpre o mesmo papel:
        mostra qual premissa está, de fato, decidindo a compra.</p></div>
    </div>
    <div class="btn-row no-print">
      <button class="btn ghost" onclick="g3_decisao()">← Voltar</button>
      <div class="spacer"></div>
      <button class="btn ghost" onclick="window.print()">Imprimir / PDF</button>
      <button class="btn" onclick="home()">Concluir mesa ✓</button>
    </div>
  `);
}

/* init */
document.addEventListener("DOMContentLoaded", () => {
  home();
  /* pré-desenhar barras quando entrar no passo de sensibilidade */
  const obs = new MutationObserver(() => { if ($("#stacks") && !$("#stacks").innerHTML) g3_drawStacks(); });
  obs.observe(document.getElementById("app"), { childList: true, subtree: true });
});

</script>
</body>
</html>
